  <g>
    <rect x="280" y="238" width="180" height="140" rx="14" fill="url(#ecom-p2)"/>
    <rect x="280" y="386" width="160" height="12" rx="6" fill="#0a1a37"/>
    <rect x="280" y="406" width="100" height="10" rx="5" fill="#9fb0ce"/>
    <rect x="280" y="424" width="64" height="18" rx="9" fill="#fff3ec"/>
  </g>
  <g>
    <rect x="480" y="238" width="180" height="140" rx="14" fill="url(#ecom-p3)"/>
    <rect x="480" y="386" width="160" height="12" rx="6" fill="#0a1a37"/>
    <rect x="480" y="406" width="100" height="10" rx="5" fill="#9fb0ce"/>
    <rect x="480" y="424" width="64" height="18" rx="9" fill="#eef4fc"/>
  </g>

  <!-- bottom bar -->
  <rect x="80" y="468" width="400" height="18" rx="9" fill="#e2e8f3"/>
  <rect x="520" y="462" width="180" height="32" rx="16" fill="#f4611a"/>
