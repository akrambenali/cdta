  <rect x="80" y="170" width="640" height="46" rx="12" fill="#0a1a37"/>
  <rect x="104" y="188" width="220" height="10" rx="5" fill="#ffffff"/>
  <rect x="612" y="182" width="88" height="22" rx="11" fill="#f4611a"/>

  <!-- product grid -->
  <g>
    <rect x="80" y="238" width="180" height="140" rx="14" fill="url(#ecom-p1)"/>
    <rect x="80" y="386" width="160" height="12" rx="6" fill="#0a1a37"/>
    <rect x="80" y="406" width="100" height="10" rx="5" fill="#9fb0ce"/>
    <rect x="80" y="424" width="64" height="18" rx="9" fill="#eef4fc"/>
